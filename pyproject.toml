[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leanatlas"
version = "0.1.0"
description = "Build a Neo4j knowledge graph from Lean mathlib"
requires-python = ">=3.12"
authors = [{ name = "Fan Zhang" }]
license = { text = "MIT" }
keywords = ["lean", "lean4", "mathlib", "knowledge-graph", "visualization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "neo4j>=5.0",
    "typer>=0.15",
    "msgspec>=0.18",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
leanatlas = "leanatlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leanatlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# N815: struct field names mirror the extract.jsonl / structure.jsonl JSON
# schema verbatim (camelCase); renaming would break the serialization contract.
"src/leanatlas/models.py" = ["N815"]
"src/leanatlas/parse_source.py" = ["N815"]
# Tests: NAME_* uppercase module-identifier constants (N806) and long
# single-line Cypher query/assert lines (E501) are established test style;
# rewrapping them adds churn without readability gain.
"tests/*" = ["N806", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
