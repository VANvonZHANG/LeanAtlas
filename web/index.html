<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mathlib_kg · 模块全景 POC</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #e8e8e8;
               font-family: system-ui, -apple-system, sans-serif; }
  #container { position: absolute; inset: 0; }
  #overlay   { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .topic-label { position: absolute; transform: translate(-50%, -50%);
                 font-size: 20px; font-weight: 600; color: #cfd8ff; opacity: .8;
                 text-shadow: 0 0 8px #000, 0 0 3px #000; white-space: nowrap; }
  .topic-label .zh { font-size: 12px; font-weight: 400; opacity: .7; margin-left: 8px; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; opacity: .6; }
  #err  { position: absolute; inset: 0; display: none; align-items: center;
          justify-content: center; color: #ff8080; font-size: 16px; }
</style>
</head>
<body>
<div id="container"></div>
<div id="overlay"></div>
<div id="hint">滚轮缩放 · 拖拽平移 · 点击节点=高亮直接邻居 · 点击空白复原</div>
<div id="err"></div>

<script type="module">
const fail = (msg) => {
  const e = document.getElementById('err');
  e.style.display = 'flex'; e.textContent = msg;
  throw new Error(msg);
};
let Sigma, Graph;
try {
  Sigma = (await import('./vendor/sigma.esm.js')).default;
  Graph = (await import('./vendor/graphology.esm.js')).default;
} catch (e) { fail('vendor 加载失败（先完成 Task 11 下载）: ' + e); }

let data;
try { data = await (await fetch('data.json')).json(); }
catch (e) { fail('data.json 加载失败（先跑 mathlib-kg layout）: ' + e); }
if (data.schemaVersion !== 1) fail('不支持的 schemaVersion: ' + data.schemaVersion);

const g = new Graph({ type: 'directed', multi: false });
for (const n of data.nodes) {
  g.addNode(n.name, {
    x: n.x, y: -n.y,                       // y 取负：让 y 小的带（Probability=20）在上方
    size: n.r * 2,                         // k=2：渲染参数，非契约
    color: n.color,
    label: n.name.split('.').slice(-2).join('.'),   // 短标签：末两级
    title: `${n.title ?? n.name}\n${n.declCount} decls · closure ${n.closureSize}`,
  });
}
for (const [a, b] of data.edges) {
  const s = data.nodes[a].name, t = data.nodes[b].name;
  if (!g.hasEdge(s, t)) g.addEdge(s, t, { color: '#26304a', size: 0.5 });
}

// ---- topic 大字：DOM overlay，锚点=该 topic 节点 x 均值 / 带值 y ----
const present = new Set(data.nodes.map(n => n.topic));
const anchors = data.topics.filter(t => present.has(t.id)).map(t => {
  const xs = data.nodes.filter(n => n.topic === t.id).map(n => n.x);
  return { t, x: xs.reduce((s, v) => s + v, 0) / xs.length, y: -t.y };
});
const overlay = document.getElementById('overlay');
const labelEls = anchors.map(a => {
  const d = document.createElement('div');
  d.className = 'topic-label';
  d.innerHTML = `${a.t.label}<span class="zh">${a.t.labelZh}</span>`;
  overlay.appendChild(d);
  return [a, d];
});

const container = document.getElementById('container');
const renderer = new Sigma(g, container, {
  labelRenderedSizeThreshold: 8,   // 两级 LOD：缩放不足时隐藏节点标签（topic 大字常显）
  labelDensity: 0.3,
  labelGridCellSize: 60,
  labelColor: { color: '#cfd8ff' },
  minCameraRatio: 0.02,
  maxCameraRatio: 60,
  defaultNodeType: 'circle',
});

function refreshOverlay() {        // 世界 → 屏幕；越界隐藏
  const w = container.clientWidth, h = container.clientHeight;
  for (const [a, d] of labelEls) {
    const p = renderer.graphToViewport({ x: a.x, y: a.y });
    const visible = p.x > -50 && p.x < w + 50 && p.y > -20 && p.y < h + 20;
    d.style.display = visible ? '' : 'none';
    d.style.left = p.x + 'px';
    d.style.top = p.y + 'px';
  }
}
renderer.on('afterRender', refreshOverlay);

// ---- 点击高亮：自身 + 直接邻居保色，其余暗化（reducer 式，sigma 原生 redraw）----
const DIM_NODE = '#1a2030';
const origColor = new Map(g.nodes().map(n => [n, g.getNodeAttribute(n, 'color')]));
function restore() {
  for (const n of g.nodes()) g.setNodeAttribute(n, 'color', origColor.get(n));
}
let selected = null;
renderer.on('clickNode', ({ node }) => {
  if (selected === node) { selected = null; restore(); return; }
  selected = node;
  const keep = new Set([node, ...g.neighbors(node)]);
  for (const n of g.nodes()) {
    g.setNodeAttribute(n, 'color', keep.has(n) ? origColor.get(n) : DIM_NODE);
  }
});
renderer.on('clickStage', () => { selected = null; restore(); });

// ---- hover title 提示 [本地修复·T7 先例]：sigma 3.0.3 无原生 tooltip/title 渲染
// （vendor 全文 0 处 title/tooltip，canvas 节点也不会触发浏览器原生 title），
// 故用 enterNode/leaveNode 事件 + 节点 title 属性补一个 DOM 悬浮提示 ----
const tip = document.createElement('div');
tip.style.cssText =
  'position:fixed;z-index:10;display:none;pointer-events:none;max-width:340px;' +
  'padding:6px 9px;background:#11141c;border:1px solid #2a3242;border-radius:6px;' +
  'font-size:12px;line-height:1.5;color:#dfe3f0;white-space:pre-wrap;';
document.body.appendChild(tip);
let mx = 0, my = 0;
container.addEventListener('mousemove', ev => { mx = ev.clientX; my = ev.clientY; moveTip(); });
function moveTip() {
  if (tip.style.display === 'none') return;
  tip.style.left = Math.min(mx + 14, innerWidth  - tip.offsetWidth  - 8) + 'px';
  tip.style.top  = Math.min(my + 14, innerHeight - tip.offsetHeight - 8) + 'px';
}
renderer.on('enterNode', ({ node }) => {
  tip.textContent = g.getNodeAttribute(node, 'title');
  tip.style.display = 'block'; moveTip();
});
renderer.on('leaveNode', () => { tip.style.display = 'none'; });
</script>
</body>
</html>
